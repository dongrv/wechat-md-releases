name: Publish desktop update policy
on:
  workflow_dispatch:
    inputs:
      latest:
        description: '最新桌面版本，例如 0.1.0'
        required: true
      minimum:
        description: '最低可继续复制的桌面版本，例如 0.1.0'
        required: true
      notes:
        description: '更新提示'
        required: false
permissions:
  contents: write
concurrency:
  group: desktop-update-policy
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sign and publish policy
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_KEY: ${{ secrets.DESKTOP_POLICY_SIGNING_KEY }}
          LATEST_VERSION: ${{ inputs.latest }}
          MINIMUM_VERSION: ${{ inputs.minimum }}
          UPDATE_NOTES: ${{ inputs.notes }}
        run: |
          set -eu
          umask 077
          key_file="$(mktemp)"
          trap 'rm -f "$key_file"' EXIT
          printf '%s' "$SIGNING_KEY" > "$key_file"
          python3 publish-policy.py --latest "$LATEST_VERSION" --minimum "$MINIMUM_VERSION" --notes "$UPDATE_NOTES" --key "$key_file"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add desktop-policy.json
          git commit -m "Update desktop policy for $LATEST_VERSION"
          git push
